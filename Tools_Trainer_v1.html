<html lang="en">
<head>

<title>CySA+ CS0-004 · External Tools Trainer</title>
<style>
:root{
 --accent:#1F6FB2;--accent2:#2E8B57;--purple:#7D3C98;--orange:#C56A16;--warn:#C0392B;

}
.dark{
 --bg:#0b1118;--panel:#111a24;--panel2:#0e1720;--border:#26374a;--text:#e8eef5;--muted:#9db0c4;
 --chip:#172536;--dash:#31445a;--good:#7be49a;--goodbg:rgba(123,228,154,.10);--goodbd:rgba(123,228,154,.36);
 --bad:#ff9494;--badbg:rgba(255,148,148,.09);--badbd:rgba(255,148,148,.35);--neutral:rgba(105,170,235,.09);
 --selected:rgba(235,165,85,.12);--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.42}
header{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 15px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
h1{margin:0;font-size:clamp(1rem,2vw,1.28rem);color:var(--accent)}
h1 .sub{font-size:.78em;font-weight:550;color:var(--muted);margin-left:6px}
.spacer{flex:1}.pill{display:inline-block;background:var(--chip);border:1px solid var(--border);padding:3px 9px;border-radius:999px;font-size:.8rem;color:var(--muted)}
button,select,input{font:inherit}button{cursor:pointer;background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px}button:hover{background:var(--dash)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.primary:hover{filter:brightness(.92)}
main{max-width:1500px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:14px}.sidebar-hidden{grid-template-columns:1fr}.sidebar-hidden aside{display:none}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.quiz-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:10px}
.quiz-picker label,.sub-picker label{font-weight:750;color:var(--muted);font-size:.86rem}
select{background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px}
#quizSelect{min-width:245px}.quiz-desc{font-size:.82rem;color:var(--muted);flex:1;min-width:240px}
.instructions{font-size:.88rem;background:var(--neutral);border-left:3px solid var(--accent);padding:8px 10px;border-radius:7px;margin-bottom:10px}
.sub-picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.sub-picker .small{font-size:.78rem;color:var(--muted)}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.result{display:none;margin-top:9px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--neutral);font-size:.85rem}.result.show{display:block}.result .big{font-weight:800;color:var(--accent)}
.quiz-workspace{display:grid;grid-template-columns:minmax(540px,1fr) minmax(275px,325px);gap:12px;align-items:start}.quiz-stage{min-width:0}
.source-tray{position:sticky;top:72px;z-index:10;max-height:calc(100vh - 88px);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:11px;background:var(--panel2);box-shadow:var(--shadow)}
.tray-head{padding:9px 10px 7px;border-bottom:1px solid var(--border);background:var(--panel)}.tray-title{font-weight:850;color:var(--accent);font-size:.9rem}.tray-help{font-size:.75rem;color:var(--muted);margin-top:2px}
.tray-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tray-actions button{padding:6px 8px;font-size:.78rem}
.tray-tabs{display:flex;gap:5px;padding:7px;border-bottom:1px solid var(--border);background:var(--chip);flex-wrap:wrap}.tray-tab{padding:5px 8px;font-size:.75rem}.tray-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tray-body{min-height:0;overflow:hidden;display:flex;flex:1}.tray-pane{display:none;overflow:auto;padding:7px;width:100%;overscroll-behavior:contain}.tray-pane.active{display:block}
.bank{display:flex;flex-wrap:wrap;gap:7px;padding:9px;background:var(--chip);border:1px dashed var(--dash);border-radius:9px;min-height:48px}.source-tray .bank{margin:0;min-height:0;border:0;background:transparent;padding:3px}
.bank-label{width:100%;font-size:.73rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.source-tray .bank-label{position:sticky;top:0;background:var(--panel2);padding:4px 2px;z-index:1}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:7px 10px;cursor:grab;user-select:none;font-size:.84rem;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.chip:active{cursor:grabbing}.chip.selected{outline:2px solid var(--orange);background:var(--selected)}.chip.correct{background:var(--goodbg);border-color:var(--goodbd);color:var(--good)}.chip.wrong{background:var(--badbg);border-color:var(--badbd);color:var(--bad)}
.chip.cue-chip{border-radius:9px;line-height:1.32;width:100%;font-size:.79rem}.chip.name-chip{font-weight:700}
.cat-grid{display:grid;grid-template-columns:1fr;gap:9px}.cat-card{border:1px solid var(--border);border-radius:10px;background:var(--panel2);overflow:hidden}.cat-title{font-weight:850;color:var(--accent);padding:7px 9px;border-bottom:1px solid var(--border);font-size:.88rem}
.license-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}.bucket{min-height:88px;padding:7px;border-right:1px solid var(--border);background:var(--panel)}.bucket:last-child{border-right:0}.bucket.over,.slot.over{background:var(--neutral);outline:2px dashed var(--accent);outline-offset:-3px}
.bucket h4{margin:0 0 5px;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.bucket .chip{margin:3px}
.match-grid{display:grid;grid-template-columns:minmax(170px,.7fr) 1.3fr;gap:7px;align-items:stretch}.match-name{display:flex;align-items:center;padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--chip);font-weight:800;font-size:.83rem}
.slot{min-height:50px;border:2px dashed var(--dash);border-radius:8px;padding:5px;background:var(--panel);display:flex;align-items:center;flex-wrap:wrap;gap:4px}.slot .chip{width:100%}
.mcq-list{display:grid;gap:10px}.mcq{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--panel2)}.mcq-q{font-weight:700;font-size:.88rem;margin-bottom:7px}.cue-box{margin:5px 0 8px;padding:7px 9px;border-left:3px solid var(--purple);background:rgba(125,60,152,.07);border-radius:6px;font-size:.83rem}
.mcq-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.opt{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:8px;cursor:pointer;font-size:.82rem}.opt:hover{background:var(--chip)}.opt.sel{border-color:var(--accent);background:var(--neutral)}.opt.correct{background:var(--goodbg);border-color:var(--goodbd);color:var(--good)}.opt.wrong{background:var(--badbg);border-color:var(--badbd);color:var(--bad)}
.mcq-why{display:none;margin-top:8px;border-top:1px solid var(--border);padding-top:7px;font-size:.8rem;color:var(--muted)}.mcq.graded .mcq-why{display:block}.why-row{margin:4px 0}.why-row b{color:var(--text)}
.cluster-note{font-size:.82rem;margin:8px 0;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--neutral)}.cluster-note strong{color:var(--accent)}
.name-buckets{display:grid;grid-template-columns:1fr 1fr;gap:9px}.name-buckets .bucket{border:1px solid var(--border);border-radius:10px;min-height:210px}.name-buckets .bucket h3{margin:0 0 5px;color:var(--accent);font-size:.9rem}.name-buckets .hint{font-size:.75rem;color:var(--muted);margin-bottom:6px}
aside .card{position:sticky;top:72px;max-height:calc(100vh - 88px);overflow:auto}aside h2{margin:0 0 8px;color:var(--accent);font-size:1rem}aside details{border-bottom:1px solid var(--border);padding:5px 0 9px}aside summary{cursor:pointer;font-weight:780;color:var(--accent);padding:5px 0;font-size:.88rem}
aside p,aside li{font-size:.81rem}aside ul{padding-left:18px;margin:6px 0}.ref-table{width:100%;border-collapse:collapse;font-size:.73rem}.ref-table th,.ref-table td{border:1px solid var(--border);padding:4px 5px;vertical-align:top}.ref-table th{background:var(--chip);text-align:left}
.callout{border-left:3px solid var(--accent);background:var(--neutral);padding:7px 8px;border-radius:6px;margin:7px 0;font-size:.8rem}.callout.warn{border-left-color:var(--orange);background:rgba(197,106,22,.09)}
#cheatSearch{width:100%;background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;margin-bottom:8px}.tool-cheat{margin:5px 0;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--panel2)}.tool-cheat .tn{font-weight:800;color:var(--text);font-size:.8rem}.tool-cheat .meta{font-size:.71rem;color:var(--muted);margin:1px 0}.tool-cheat .cue{font-size:.74rem;margin-top:3px}
.hidden-by-search{display:none!important}.tiny{font-size:.72rem;color:var(--muted)}
@media(max-width:1100px){main{grid-template-columns:1fr}aside .card{position:static;max-height:none}.quiz-workspace{grid-template-columns:minmax(0,1fr) minmax(250px,300px)}}
@media(max-width:800px){.quiz-workspace{grid-template-columns:1fr}.source-tray{position:sticky;top:auto;bottom:6px;max-height:42vh}.tray-pane{max-height:26vh}.mcq-opts{grid-template-columns:1fr}.license-grid{grid-template-columns:1fr 1fr}.match-grid{grid-template-columns:1fr}.match-name{margin-top:5px}.name-buckets{grid-template-columns:1fr 1fr}}
@media(max-width:520px){main{padding:8px}.card{padding:9px}.license-grid,.name-buckets{grid-template-columns:1fr}.bucket{border-right:0;border-bottom:1px solid var(--border)}.bucket:last-child{border-bottom:0}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const rand=a=>a[Math.floor(Math.random()*a.length)];
const slug=s=>String(s).toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const state={quiz:'sorter',selected:null,sortSet:'soc-platforms',functionCat:'Mixed random 8',cluster:DATA.clusters[0].id,scenarioStyle:'hard',scenarioQuestions:[]};
const QUIZZES=[
 {id:'sorter',name:'Category + License Sorter',desc:'Core drill: place each tool into both its correct category and its Open Source/Free vs Commercial/Paid subcategory.'},
 {id:'function',name:'Tool → Function Match',desc:'Match anonymous exam-style use cues to the correct tool name.'},

function setScore(a,b){$('#score').textContent=`${a} / ${b}`;}
function clearScore(){setScore(0,0)}
function cleanupSelection(){if(state.selected)state.selected.classList.remove('selected');state.selected=null}
function clearMarks(root=document){$$('.chip.correct,.chip.wrong,.opt.correct,.opt.wrong',root).forEach(x=>x.classList.remove('correct','wrong'))}
function uniqueTools(){const seen=new Set();return DATA.tools.filter(t=>{if(seen.has(t.tool))return false;seen.add(t.tool);return true})}
function toolsForCategory(c){return DATA.tools.filter(t=>t.category===c)}
function categoryForToolName(name){return DATA.tools.find(t=>t.tool===name)}
function homeBank(c){return document.getElementById(c.dataset.home)}
function returnHome(c){const h=homeBank(c);if(h){h.appendChild(c);c.classList.remove('correct','wrong','selected');cleanupSelection()}}
function makeChip({id,text,home,kind='generic',expected='',bucket='',html=''}){const c=document.createElement('div');c.className='chip '+(kind==='cue'?'cue-chip ':kind==='name'?'name-chip ':'');c.draggable=true;c.dataset.cid=id;c.dataset.home=home;c.dataset.kind=kind;if(expected)c.dataset.expected=expected;if(bucket)c.dataset.correctBucket=bucket;if(html)c.innerHTML=html;else c.textContent=text;
 c.addEventListener('dragstart',e=>{cleanupSelection();e.dataTransfer.setData('text/plain',c.dataset.cid);c.style.opacity='.5'});c.addEventListener('dragend',()=>c.style.opacity='1');
 c.addEventListener('click',e=>{e.stopPropagation();const p=c.parentElement;if(p&&(p.classList.contains('bucket')||p.classList.contains('slot'))){returnHome(c);clearScore();return}if(p&&p.classList.contains('bank')){if(state.selected===c)cleanupSelection();else{cleanupSelection();state.selected=c;c.classList.add('selected')}}});return c}
function canAccept(zone,c){if(zone.classList.contains('slot'))return !zone.dataset.acceptKind||zone.dataset.acceptKind===c.dataset.kind;return true}
function bindDrop(zone,isBucket=false){zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('over')});zone.addEventListener('dragleave',()=>zone.classList.remove('over'));zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('over');const c=$(`.chip[data-cid="${CSS.escape(e.dataTransfer.getData('text/plain'))}"]`);if(!c||!canAccept(zone,c))return;isBucket?placeBucket(zone,c):placeSlot(zone,c)});zone.addEventListener('click',()=>{if(!state.selected||!canAccept(zone,state.selected))return;isBucket?placeBucket(zone,state.selected):placeSlot(zone,state.selected)})}
function placeBucket(z,c){z.appendChild(c);c.classList.remove('correct','wrong','selected');cleanupSelection();clearScore()}
function placeSlot(z,c){const old=z.querySelector('.chip');if(old&&old!==c)returnHome(old);z.appendChild(c);c.classList.remove('correct','wrong','selected');cleanupSelection();clearScore()}
function trayHtml(title,help,tabs,actions=true){return `<div class="source-tray"><div class="tray-head"><div class="tray-title">${title}</div><div class="tray-help">${help}</div>${actions?'<div class="tray-actions"><button class="primary" id="gradeBtn">Grade / Re-score</button><button id="shuffleBtn">Shuffle Pool</button><button id="quizReset">Reset</button></div>':''}</div><div class="tray-tabs">${tabs.map((t,i)=>`<button class="tray-tab ${i===0?'active':''}" data-pane="${t.id}">${t.label}</button>`).join('')}</div><div class="tray-body">${tabs.map((t,i)=>`<div class="tray-pane ${i===0?'active':''}" data-pane="${t.id}"><div class="bank" id="${t.bank}"><div class="bank-label">${t.bankLabel||t.label}</div></div></div>`).join('')}</div><div class="result" id="result"></div></div>`}
function bindTrayTabs(){const tabs=$$('.tray-tab');tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');$$('.tray-pane').forEach(p=>p.classList.toggle('active',p.dataset.pane===t.dataset.pane))}))}
function splitPools(items,n=3){const a=shuffle([...items]),out=Array.from({length:Math.min(n,Math.max(1,Math.ceil(a.length/5)))},()=>[]);a.forEach((x,i)=>out[i%out.length].push(x));return out}
function showResult(right,total,placed,extra=''){const r=$('#result');if(!r)return;r.classList.add('show');const un=total-placed;r.innerHTML=`<span class="big">${right} of ${total} correct.</span> ${un>0?`${un} unanswered/unplaced. `:''}${right===total?'✅ Perfect.':'Green = correct; red = wrong. Change anything and Grade / Re-score again.'}${extra?`<div style="margin-top:6px">${extra}</div>`:''}`}
function gradeBuckets(total){let right=0,placed=0;$$('.bucket .chip').forEach(c=>{placed++;const ok=c.dataset.correctBucket===c.parentElement.dataset.key;c.classList.toggle('correct',ok);c.classList.toggle('wrong',!ok);if(ok)right++});setScore(right,total);showResult(right,total,placed)}
function gradeSlots(total,extra=''){let right=0,placed=0;$$('.slot').forEach(s=>{const c=s.querySelector('.chip');if(!c)return;placed++;const ok=c.dataset.expected===s.dataset.expected;c.classList.toggle('correct',ok);c.classList.toggle('wrong',!ok);if(ok)right++});setScore(right,total);showResult(right,total,placed,extra)}
function bindBasicControls(resetFn,shuffleFn){$('#gradeBtn')?.addEventListener('click',()=>{});$('#quizReset')?.addEventListener('click',resetFn);$('#shuffleBtn')?.addEventListener('click',shuffleFn||(()=>{$$('.bank').forEach(b=>shuffle($$('.chip',b)).forEach(c=>b.appendChild(c)))}))}
function initPicker(){const s=$('#quizSelect');QUIZZES.forEach(q=>{const o=document.createElement('option');o.value=q.id;o.textContent=q.name;s.appendChild(o)});s.value=state.quiz;s.addEventListener('change',()=>{state.quiz=s.value;renderQuiz()})}
function renderSorter(){const host=$('#quizHost'),set=DATA.categorySets.find(x=>x.id===state.sortSet)||DATA.categorySets[0];const items=DATA.tools.filter(t=>set.categories.includes(t.category));const pools=splitPools(items,3);const tabs=pools.map((p,i)=>({id:`p${i}`,label:`Pool ${i+1}`,bank:`sort-bank-${i}`,bankLabel:`Tool names — ${p.length} items`}));
 host.innerHTML=`<div class="instructions"><b>Core drill.</b> Every placement must get <b>both dimensions</b> right: the tool category and the study-sheet license bucket. Tool chips show names only. The sticky tray remains visible while you work.</div><div class="sub-picker"><label>Set:</label><select id="sortSet">${DATA.categorySets.map(s=>`<option value="${s.id}" ${s.id===set.id?'selected':''}>${s.name}</option>`).join('')}</select><span class="small">${items.length} placements in this set.</span></div><div class="quiz-workspace"><div class="quiz-stage"><div class="cat-grid" id="catGrid"></div></div>${trayHtml('Tool Name Tray','Click a tool then a bucket if drag-and-drop is awkward. Clicking a placed tool sends it home.',tabs)}</div>`;
 set.categories.forEach(cat=>{const card=document.createElement('div');card.className='cat-card';card.innerHTML=`<div class="cat-title">${cat}</div><div class="license-grid"><div class="bucket" data-key="${slug(cat)}::free"><h4>Open Source / Free</h4></div><div class="bucket" data-key="${slug(cat)}::paid"><h4>Commercial / Paid</h4></div></div>`;$('#catGrid').appendChild(card);$$('.bucket',card).forEach(b=>bindDrop(b,true))});
 pools.forEach((pool,i)=>pool.forEach(t=>{const b=t.subcategory==='Open Source / Free'?'free':'paid';$(`#sort-bank-${i}`).appendChild(makeChip({id:`sort-${t.id}`,text:t.tool,home:`sort-bank-${i}`,kind:'name',bucket:`${slug(t.category)}::${b}`}))}));
 bindTrayTabs();$('#sortSet').addEventListener('change',e=>{state.sortSet=e.target.value;renderSorter()});$('#gradeBtn').addEventListener('click',()=>gradeBuckets(items.length));$('#quizReset').addEventListener('click',renderSorter);$('#shuffleBtn').addEventListener('click',()=>{$$('.bank').forEach(b=>shuffle($$('.chip',b)).forEach(c=>b.appendChild(c)))})
}
function categoryOptions(){return ['Mixed random 8',...Array.from(new Set(DATA.tools.map(t=>t.category)))]}
function functionItems(sel){if(sel==='Mixed random 8'){const u=uniqueTools();return shuffle(u).slice(0,8)}return toolsForCategory(sel)}
function renderFunction(){const host=$('#quizHost'),items=functionItems(state.functionCat);const pools=splitPools(items,2);const tabs=pools.map((p,i)=>({id:`f${i}`,label:`Cue Pool ${i+1}`,bank:`func-bank-${i}`,bankLabel:'Anonymous exam-style cues'}));
 host.innerHTML=`<div class="instructions"><b>What does the tool actually do?</b> Match each anonymous scenario cue to the correct tool name. The cue wording is derived from the spreadsheet’s “Scenario cue → correct pick” column.</div><div class="sub-picker"><label>Category:</label><select id="functionCat">${categoryOptions().map(c=>`<option ${c===state.functionCat?'selected':''}>${c}</option>`).join('')}</select><span class="small">${items.length} tools in this drill.</span></div><div class="quiz-workspace"><div class="quiz-stage"><div class="match-grid" id="matchGrid"></div></div>${trayHtml('Scenario Cue Tray','The cue cards deliberately omit the answer name. Match the discriminator to the tool.',tabs)}</div>`;
 shuffle(items).forEach(t=>{const n=document.createElement('div');n.className='match-name';n.textContent=t.tool;$('#matchGrid').appendChild(n);const s=document.createElement('div');s.className='slot';s.dataset.expected=t.id;s.dataset.acceptKind='cue';bindDrop(s);$('#matchGrid').appendChild(s)});
 pools.forEach((p,i)=>p.forEach(t=>$(`#func-bank-${i}`).appendChild(makeChip({id:`func-${t.id}`,text:t.cue||t.features,home:`func-bank-${i}`,kind:'cue',expected:t.id}))));
 bindTrayTabs();$('#functionCat').addEventListener('change',e=>{state.functionCat=e.target.value;renderFunction()});$('#gradeBtn').addEventListener('click',()=>gradeSlots(items.length));$('#quizReset').addEventListener('click',renderFunction);$('#shuffleBtn').addEventListener('click',()=>{$$('.bank').forEach(b=>shuffle($$('.chip',b)).forEach(c=>b.appendChild(c)))})
}
function clusterNeighbors(tool){const set=new Set();DATA.clusters.forEach(c=>{if(c.toolNames.includes(tool))c.toolNames.forEach(n=>{if(n!==tool)set.add(n)})});return [...set]}
function setNeighbors(t){const set=DATA.categorySets.find(s=>s.categories.includes(t.category));return set?DATA.tools.filter(x=>set.categories.includes(x.category)&&x.tool!==t.tool):[]}
function chooseDistractors(t,style){const chosen=[],used=new Set([t.tool]);const add=x=>{if(x&&!used.has(x.tool)){chosen.push(x);used.add(x.tool)}};clusterNeighbors(t.tool).map(categoryForToolName).forEach(add);toolsForCategory(t.category).filter(x=>x.tool!==t.tool).forEach(add);setNeighbors(t).forEach(add);
 const plausible=chosen.slice(0,3);if(style==='hard'){while(plausible.length<3){add(rand(uniqueTools()));plausible.splice(0,plausible.length,...chosen.slice(0,3))}return plausible.slice(0,3).map(x=>({type:'real',tool:x}))}
 const two=plausible.slice(0,2);while(two.length<2){const x=rand(uniqueTools());if(x.tool!==t.tool&&!two.some(y=>y.tool===x.tool))two.push(x)}
 const useSynthetic=Math.random()<.6;let last;if(useSynthetic){last={type:'synthetic',name:rand(DATA.synthetic)}}else{let candidates=uniqueTools().filter(x=>x.tool!==t.tool&&!two.some(y=>y.tool===x.tool)&&x.category!==t.category);last={type:'real',tool:rand(candidates)}}
 return [...two.map(x=>({type:'real',tool:x})),last]
}
function makeScenarioRound(){const u=shuffle(uniqueTools()).filter(t=>t.cue);state.scenarioQuestions=u.slice(0,10).map((t,i)=>({id:`q${Date.now()}-${i}`,correct:t,distractors:chooseDistractors(t,state.scenarioStyle)}))}
function renderScenario(){if(!state.scenarioQuestions.length)makeScenarioRound();const host=$('#quizHost');host.innerHTML=`<div class="instructions"><b>Exam-style selection.</b> The correct answer and the most plausible distractors come from the same category or one of your high-confusion clusters. “Exam mix” can also add an irrelevant real tool or a synthetic name.</div><div class="sub-picker"><label>Distractors:</label><select id="scenarioStyle"><option value="hard" ${state.scenarioStyle==='hard'?'selected':''}>Hard — plausible tools only</option><option value="mix" ${state.scenarioStyle==='mix'?'selected':''}>Exam mix — plausible + irrelevant/synthetic</option></select><button id="newRound">New 10-Question Round</button></div><div class="mcq-list" id="mcqList"></div><div class="controls"><button class="primary" id="gradeBtn">Grade / Re-score</button><button id="quizReset">Reset Selections</button></div><div class="result" id="result"></div>`;
 state.scenarioQuestions.forEach((q,i)=>{const opts=[{type:'real',tool:q.correct},...q.distractors];const d=document.createElement('div');d.className='mcq';d.dataset.answer=q.correct.tool;d.innerHTML=`<div class="mcq-q">${i+1}. Which tool is the <b>BEST</b> fit?</div><div class="cue-box">${q.correct.cue}</div><div class="mcq-opts"></div><div class="mcq-why"></div>`;
 shuffle(opts).forEach(op=>{const name=op.type==='synthetic'?op.name:op.tool.tool;const o=document.createElement('div');o.className='opt';o.textContent=name;o.dataset.value=name;o.dataset.kind=op.type;o.addEventListener('click',()=>{$$('.opt',d).forEach(x=>x.classList.remove('sel','correct','wrong'));o.classList.add('sel');d.classList.remove('graded');clearScore()});$('.mcq-opts',d).appendChild(o)});
 const distractText=q.distractors.map(op=>op.type==='synthetic'?`<div class="why-row"><b>${op.name}</b> — synthetic distractor generated for this trainer; it is not one of the tools in your spreadsheet.</div>`:`<div class="why-row"><b>${op.tool.tool}</b> — better fit when the cue is: ${op.tool.cue}</div>`).join('');
 $('.mcq-why',d).innerHTML=`<div class="why-row"><b>${q.correct.tool}</b> — ${q.correct.features}</div>${distractText}`;$('#mcqList').appendChild(d)});
 $('#scenarioStyle').addEventListener('change',e=>{state.scenarioStyle=e.target.value;makeScenarioRound();renderScenario()});$('#newRound').addEventListener('click',()=>{makeScenarioRound();renderScenario()});$('#quizReset').addEventListener('click',()=>{$$('.opt').forEach(o=>o.classList.remove('sel','correct','wrong'));$$('.mcq').forEach(q=>q.classList.remove('graded'));clearScore();$('#result').classList.remove('show')});$('#gradeBtn').addEventListener('click',gradeScenario)
}
function gradeScenario(){let right=0,answered=0;$$('.mcq').forEach(q=>{const sel=$('.opt.sel',q);if(!sel)return;answered++;const ok=sel.dataset.value===q.dataset.answer;$$('.opt',q).forEach(o=>{o.classList.remove('correct','wrong');if(o.dataset.value===q.dataset.answer)o.classList.add('correct');else if(o===sel)o.classList.add('wrong')});q.classList.add('graded');if(ok)right++});setScore(right,state.scenarioQuestions.length);showResult(right,state.scenarioQuestions.length,answered)}
function currentCluster(){return DATA.clusters.find(c=>c.id===state.cluster)||DATA.clusters[0]}
function renderConfusion(){const c=currentCluster(),items=c.toolNames.map(categoryForToolName).filter(Boolean);const pools=splitPools(items,2);const tabs=pools.map((p,i)=>({id:`c${i}`,label:`Cue Pool ${i+1}`,bank:`cluster-bank-${i}`,bankLabel:'Anonymous discriminator cues'}));const host=$('#quizHost');
 host.innerHTML=`<div class="instructions"><b>Head-to-head.</b> These are the exact high-confusion groupings from the workbook’s second sheet. Match each discriminator to the tool it should make you choose.</div><div class="sub-picker"><label>Cluster:</label><select id="clusterSelect">${DATA.clusters.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${x.name}</option>`).join('')}</select><span class="small">${c.toolsText}</span></div><div class="quiz-workspace"><div class="quiz-stage"><div class="match-grid" id="clusterGrid"></div><div class="cluster-note" id="clusterDecision" style="display:none"><strong>Workbook discriminator:</strong> ${c.decision}</div></div>${trayHtml('Discriminator Tray','Match what makes a tool the better pick in a specific circumstance.',tabs)}</div>`;
 shuffle(items).forEach(t=>{const n=document.createElement('div');n.className='match-name';n.textContent=t.tool;$('#clusterGrid').appendChild(n);const s=document.createElement('div');s.className='slot';s.dataset.expected=t.tool;s.dataset.acceptKind='cue';bindDrop(s);$('#clusterGrid').appendChild(s)});
 pools.forEach((p,i)=>p.forEach(t=>$(`#cluster-bank-${i}`).appendChild(makeChip({id:`cluster-${slug(c.id)}-${t.id}`,text:t.cue||t.features,home:`cluster-bank-${i}`,kind:'cue',expected:t.tool}))));
 bindTrayTabs();$('#clusterSelect').addEventListener('change',e=>{state.cluster=e.target.value;renderConfusion()});$('#gradeBtn').addEventListener('click',()=>{gradeSlots(items.length,c.decision);$('#clusterDecision').style.display='block'});$('#quizReset').addEventListener('click',renderConfusion);$('#shuffleBtn').addEventListener('click',()=>{$$('.bank').forEach(b=>shuffle($$('.chip',b)).forEach(x=>b.appendChild(x)))})
}
function makeNameRound(){const real=shuffle(uniqueTools()).slice(0,10).map(t=>({name:t.tool,real:true}));const fake=shuffle(DATA.synthetic).slice(0,10).map(name=>({name,real:false}));return shuffle([...real,...fake])}
let nameRound=makeNameRound();
function renderNames(){const pools=splitPools(nameRound,3);const tabs=pools.map((p,i)=>({id:`n${i}`,label:`Pool ${i+1}`,bank:`name-bank-${i}`,bankLabel:`Names — ${p.length} items`}));const host=$('#quizHost');
 host.innerHTML=`<div class="instructions"><b>Name-recognition drill.</b> “Legitimate” means the name appears in your uploaded study spreadsheet. Synthetic distractors are invented for this trainer; this mode is not making a global claim that a coincidentally similar product name could never exist.</div><div class="quiz-workspace"><div class="quiz-stage"><div class="name-buckets"><div class="bucket" data-key="real"><h3>Study-Sheet Tool / Service</h3><div class="hint">A legitimate name from your 100-tool study list.</div></div><div class="bucket" data-key="fake"><h3>Synthetic Distractor</h3><div class="hint">Invented for this trainer.</div></div></div></div>${trayHtml('Name Tray','Names only — no category or function hints.',tabs)}</div>`;
 $$('.name-buckets .bucket').forEach(b=>bindDrop(b,true));pools.forEach((p,i)=>p.forEach((x,j)=>$(`#name-bank-${i}`).appendChild(makeChip({id:`name-${i}-${j}-${slug(x.name)}`,text:x.name,home:`name-bank-${i}`,kind:'name',bucket:x.real?'real':'fake'}))));
 bindTrayTabs();$('#gradeBtn').addEventListener('click',()=>gradeBuckets(nameRound.length));$('#quizReset').addEventListener('click',()=>{nameRound=makeNameRound();renderNames()});$('#shuffleBtn').addEventListener('click',()=>{$$('.bank').forEach(b=>shuffle($$('.chip',b)).forEach(c=>b.appendChild(c)))})
}
function renderCheats(){const host=$('#cheatHost');const cats=[...new Set(DATA.tools.map(t=>t.category))];host.innerHTML=`<details open><summary>How this trainer uses your spreadsheet</summary><div class="callout">The <b>Open Source / Free</b> and <b>Commercial / Paid</b> buckets follow your spreadsheet exactly. They are study buckets, not strict software-license taxonomy. A commercial product can still have a free/community tier and remain in the Commercial/Paid bucket.</div><p><b>${uniqueTools().length} unique tool names</b> appear across <b>${DATA.tools.length} category entries</b>. Two tools are intentionally cross-listed: <b>Strings</b> and <b>hping3</b>.</p></details><details><summary>Exam-selection strategy from your cues</summary><ul><li>Start with the <b>verb</b>: capture, analyze, image, exploit, provision, configure, share, correlate, scan, or recover.</li><li>Then use the <b>discriminator</b>: GUI vs CLI, free vs commercial, cloud vs on-prem, broad scanner vs specialized tool, or vendor ecosystem.</li><li>If two answers can both perform the broad task, prefer the one whose specialty matches the stem more precisely.</li></ul></details><div id="categoryCheats"></div><details><summary>High-confusion “Which tool?” sheet</summary><table class="ref-table"><tr><th>Cluster</th><th>Tools</th><th>How to decide</th></tr>${DATA.cheatRows.map(r=>`<tr class="searchable"><td>${r.cluster}</td><td>${r.tools}</td><td>${r.decision}</td></tr>`).join('')}</table></details><details><summary>Cross-listed tools</summary><div class="callout warn"><b>Strings</b> appears under both System / Host Utility and Static Analysis / Reverse Engineering. <b>hping3</b> appears under both Network Scanner and Adversary Emulation / Exploitation. That is useful exam practice: the same tool can be categorized differently depending on the task being emphasized.</div></details>`;
 const ch=$('#categoryCheats');cats.forEach(cat=>{const d=document.createElement('details');d.className='searchable';d.innerHTML=`<summary>${cat}</summary><div class="tiny">Open Source / Free</div><div class="tool-list free"></div><div class="tiny" style="margin-top:6px">Commercial / Paid</div><div class="tool-list paid"></div>`;ch.appendChild(d);toolsForCategory(cat).forEach(t=>{const el=document.createElement('div');el.className='tool-cheat searchable';el.dataset.search=`${t.tool} ${t.category} ${t.cue} ${t.features}`.toLowerCase();el.innerHTML=`<div class="tn">${t.tool}</div><div class="meta">${t.interface} · ${t.platform}${t.free_version&&t.free_version!=='—'?` · Free option: ${t.free_version}`:''}</div><div class="cue">${t.cue}</div>`;$('.tool-list.'+(t.subcategory==='Open Source / Free'?'free':'paid'),d).appendChild(el)})});
 $('#cheatSearch').addEventListener('input',filterCheats)
}
function filterCheats(){const q=$('#cheatSearch').value.trim().toLowerCase();$$('.tool-cheat').forEach(el=>el.classList.toggle('hidden-by-search',q&&!el.dataset.search.includes(q)));if(q){$$('#categoryCheats details').forEach(d=>{const visible=$$('.tool-cheat:not(.hidden-by-search)',d).length;d.classList.toggle('hidden-by-search',visible===0);if(visible)d.open=true})}else{$$('#categoryCheats details').forEach(d=>d.classList.remove('hidden-by-search'))}}
function renderQuiz(){cleanupSelection();clearScore();const q=QUIZZES.find(x=>x.id===state.quiz);$('#quizDesc').textContent=q.desc;switch(state.quiz){case'sorter':renderSorter();break;case'function':renderFunction();break;case'scenario':state.scenarioQuestions=[];makeScenarioRound();renderScenario();break;case'confusion':renderConfusion();break;case'names':nameRound=makeNameRound();renderNames();break}}
$('#darkBtn').addEventListener('click',()=>{document.body.classList.toggle('dark');$('#darkBtn').textContent=document.body.classList.contains('dark')?'☀️ Light':'🌙 Dark';try{localStorage.setItem('tools-trainer-dark',document.body.classList.contains('dark')?'1':'0')}catch(e){}});
$('#cheatBtn').addEventListener('click',()=>{const m=$('#main');m.classList.toggle('sidebar-hidden');$('#cheatBtn').textContent=m.classList.contains('sidebar-hidden')?'Show Cheats':'Hide Cheats'});
$('#resetBtn').addEventListener('click',renderQuiz);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='Enter')$('#gradeBtn')?.click();if(e.key==='r'||e.key==='R')renderQuiz();if(e.key==='c'||e.key==='C')$('#cheatBtn').click()});
try{if(localStorage.getItem('tools-trainer-dark')==='1'){document.body.classList.add('dark');$('#darkBtn').textContent='☀️ Light'}}catch(e){}
initPicker();renderCheats();renderQuiz();
</script>
</body>
</html>
