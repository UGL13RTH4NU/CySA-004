<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.42}
header{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 15px;background:var(--panel);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
h1{margin:0;font-size:clamp(1rem,2vw,1.28rem);color:var(--accent)}
h1 .sub{font-size:.78em;font-weight:550;color:var(--muted);margin-left:6px}
.spacer{flex:1}.pill{display:inline-block;background:var(--chip);border:1px solid var(--border);padding:3px 9px;border-radius:999px;font-size:.8rem;color:var(--muted)}
button,select,input{font:inherit}button{cursor:pointer;background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 10px}button:hover{background:var(--dash)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.primary:hover{filter:brightness(.92)}

.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.quiz-picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:10px}
.quiz-picker label,.sub-picker label{font-weight:750;color:var(--muted);font-size:.86rem}
select{background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px}
#quizSelect{min-width:245px}.quiz-desc{font-size:.82rem;color:var(--muted);flex:1;min-width:240px}

.quiz-workspace{display:grid;grid-template-columns:minmax(540px,1fr) minmax(275px,325px);gap:12px;align-items:start}.quiz-stage{min-width:0}

.tray-head{padding:9px 10px 7px;border-bottom:1px solid var(--border);background:var(--panel)}.tray-title{font-weight:850;color:var(--accent);font-size:.9rem}.tray-help{font-size:.75rem;color:var(--muted);margin-top:2px}
.tray-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.tray-actions button{padding:6px 8px;font-size:.78rem}
.tray-tabs{display:flex;gap:5px;padding:7px;border-bottom:1px solid var(--border);background:var(--chip);flex-wrap:wrap}.tray-tab{padding:5px 8px;font-size:.75rem}.tray-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tray-body{min-height:0;overflow:hidden;display:flex;flex:1}.tray-pane{display:none;overflow:auto;padding:7px;width:100%;overscroll-behavior:contain}.tray-pane.active{display:block}
.bank{display:flex;flex-wrap:wrap;gap:7px;padding:9px;background:var(--chip);border:1px dashed var(--dash);border-radius:9px;min-height:48px}.source-tray .bank{margin:0;min-height:0;border:0;background:transparent;padding:3px}
.bank-label{width:100%;font-size:.73rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.source-tray .bank-label{position:sticky;top:0;background:var(--panel2);padding:4px 2px;z-index:1}
.chip{background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:7px 10px;cursor:grab;user-select:none;font-size:.84rem;max-width:100%;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.chip:active{cursor:grabbing}.chip.selected{outline:2px solid var(--orange);background:var(--selected)}.chip.correct{background:var(--goodbg);border-color:var(--goodbd);color:var(--good)}.chip.wrong{background:var(--badbg);border-color:var(--badbd);color:var(--bad)}
.chip.cue-chip{border-radius:9px;line-height:1.32;width:100%;font-size:.79rem}.chip.name-chip{font-weight:700}

.slot{min-height:50px;border:2px dashed var(--dash);border-radius:8px;padding:5px;background:var(--panel);display:flex;align-items:center;flex-wrap:wrap;gap:4px}.slot .chip{width:100%}
.mcq-list{display:grid;gap:10px}.mcq{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--panel2)}.mcq-q{font-weight:700;font-size:.88rem;margin-bottom:7px}.cue-box{margin:5px 0 8px;padding:7px 9px;border-left:3px solid var(--purple);background:rgba(125,60,152,.07);border-radius:6px;font-size:.83rem}

.callout{border-left:3px solid var(--accent);background:var(--neutral);padding:7px 8px;border-radius:6px;margin:7px 0;font-size:.8rem}.callout.warn{border-left-color:var(--orange);background:rgba(197,106,22,.09)}
#cheatSearch{width:100%;background:var(--chip);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 9px;margin-bottom:8px}.tool-cheat{margin:5px 0;padding:6px 7px;border:1px solid var(--border);border-radius:7px;background:var(--panel2)}.tool-cheat .tn{font-weight:800;color:var(--text);font-size:.8rem}.tool-cheat .meta{font-size:.71rem;color:var(--muted);margin:1px 0}.tool-cheat .cue{font-size:.74rem;margin-top:3px}
.hidden-by-search{display:none!important}.tiny{font-size:.72rem;color:var(--muted)}
@media(max-width:1100px){main{grid-template-columns:1fr}aside .card{position:static;max-height:none}.quiz-workspace{grid-template-columns:minmax(0,1fr) minmax(250px,300px)}}

</style>

gory":"Password / Credential Attack","subcategory":"Free Proprietary / No-Cost Resource","interface":"CLI / GUI","license":"Free Proprietary / No-Cost Resource","free_version":"Ongoing no-cost use","made_by":"RainbowCrack Project","platform":"Cross-platform","features":"Generates and uses rainbow tables for time-memory-tradeoff cracking. The named rainbow-table tool; current engine/binaries are no-cost while some precomputed tables are sold separately.","cue":"generate/use rainbow tables (time-memory tradeoff)","availability_sort":true,"availability_type":"free-proprietary-resource","availability_label":"Free Proprietary / No-Cost Resource","persistent_free_edition":"","availability_note":"Current upstream engine/binaries are no-cost while some rainbow tables are sold; source availability is not treated as open source here."},{"id":"bash-scripting-automation-iac-95","tool":"Bash","category":"Scripting / Automation / IaC","subcategory":"Open Source","interface":"CLI / shell","license":"Open Source","free_version":"—","made_by":"GNU","platform":"Linux/Unix/macOS","features":"Default Linux shell scripting for automation and log parsing. Recognize Bash syntax ($VAR, for/do/done, #!/bin/bash).","cue":"automate on Linux, parse logs from the shell or Bash syntax shown ($VAR, for/do/done, #!/bin/bash)","availability_sort":true,"availability_type":"open-source","availability_label":"Open Source","persistent_free_edition":"","availability_note":"Genuinely open-source project/software."},{"id":"powershell-scripting-automation-iac-96","tool":"PowerShell","category":"Scripting / Automation / IaC","subcategory":"Open Source","interface":"CLI / shell","license":"Open Source","free_version":"—","made_by":"Microsoft","platform":"Windows (also cross-platform Core)","features":"Object-oriented shell/scripting for Windows admin & IR (cmdlets like Get-Process). Recognize verb-noun cmdlets and $variables.","cue":"Windows administration/IR automation or verb-noun cmdlets shown (Get-Process, $var)","availability_sort":true,"availability_type":"open-source","availability_label":"Open Source","persistent_free_edition":"","availability_note":"Genuinely open-source project/software."},{"id":"python-scripting-automation-iac-97","tool":"Python","category":"Scripting / Automation / IaC","subcategory":"Open Source","interface":"CLI / interpreter","license":"Open Source","free_version":"—","made_by":"Python Software Foundation","platform":"Cross-platform","features":"General-purpose scripting for automation, parsing, and tooling. Most common language for custom SOC scripts.","cue":"write a custom cross-platform script/tool, parse data, glue APIs","availability_sort":true,"availability_type":"open-source","availability_label":"Open Source","persistent_free_edition":"","availability_note":"Genuinely open-source project/software."},{"id":"ansible-scripting-automation-iac-98","tool":"Ansible","category":"Scripting / Automation / IaC","subcategory":"Open Source","interface":"CLI / YAML playbooks","license":"Open Source","free_version":"—","made_by":"Red Hat","platform":"Cross-platform (agentless, SSH)","features":"Agentless configuration management/automation via YAML playbooks. Tell = 'push configuration/automation over SSH, no agent.'","cue":"CONFIGURE existing systems, agentless over SSH, YAML playbooks","availability_sort":true,"availability_type":"open-source","availability_label":"Open Source","persistent_free_edition":"","availability_note":"Genuinely open-source project/software."},{"id":"terraform-scripting-automation-iac-99","tool":"Terraform","category":"Scripting / Automation / IaC","subcategory":"Commercial + Free / Community Edition","interface":"CLI / HCL","license":"Commercial + Free / Community Edition","free_version":"Terraform Community Edition — ongoing free CLI; commercial cloud/enterprise offerings add managed capabilities.","made_by":"HashiCorp","platform":"Cross-platform / cloud","features":"Infrastructure as Code — declaratively PROVISIONS cloud infrastructure. Distinguish from Ansible: Terraform builds/provisions infrastructure; Ansible configures it. Current Community Edition is no-cost but source-available rather than OSI-open-source.","cue":"PROVISION/build cloud infrastructure declaratively (IaC, HCL)","availability_sort":true,"availability_type":"commercial-free-edition","availability_label":"Commercial + Free / Community Edition","persistent_free_edition":"Terraform Community Edition — ongoing free CLI; commercial cloud/enterprise offerings add managed capabilities.","availability_note":"Current Terraform Community Edition is no-cost but Terraform is source-available rather than OSI-open-source."},{"id":"visual-studio-code-ide-code-editor-100","tool":"Visual Studio Code","category":"IDE / Code Editor","subcategory":"Free Proprietary / No-Cost Resource","interface":"GUI","license":"Free Proprietary / No-Cost Resource","free_version":"Ongoing no-cost use","made_by":"Microsoft","platform":"Cross-platform","features":"Free, extensible code editor — a common editor for scripts and IaC. The Microsoft VS Code distribution is proprietary freeware built from the open-source Code - OSS project.","cue":"lightweight, extensible editor for scripts/IaC","availability_sort":true,"availability_type":"free-proprietary-resource","availability_label":"Free Proprietary / No-Cost Resource","persistent_free_edition":"","availability_note":"The Microsoft VS Code distribution is free proprietary software; its Code - OSS source base is open source."},{"id":"pycharm-ide-code-editor-101","tool":"PyCharm","category":"IDE / Code Editor","subcategory":"Commercial + Free / Community Edition","interface":"GUI","license":"Commercial + Free / Community Edition","free_version":"Core PyCharm features remain free indefinitely; Professional features require a paid subscription.","made_by":"JetBrains","platform":"Cross-platform","features":"Full Python IDE with debugging/refactoring. Community edition is free; Professional is paid.","cue":"full Python IDE with debugging/refactoring","availability_sort":true,"availability_type":"commercial-free-edition","availability_label":"Commercial + Free / Community Edition","persistent_free_edition":"Core PyCharm features remain free indefinitely; Professional features require a paid subscription.","availability_note":"Commercial/proprietary product with an ongoing limited free/community option."}],"categorySets":[{"id":"soc-platforms","name":"SOC Platforms","categories":["SIEM","SOAR","Endpoint Security (EDR/XDR/MDM)"]},{"id":"scanning","name":"Scanning & Vulnerability","categories":["Vulnerability Scanner","Web/Cloud Vuln Scanner","Network Scanner"]},{"id":"network-visibility","name":"Recon & Network Visibility","categories":["OSINT / Recon","Packet Analysis","NIDS/NIPS & NSM"]},{"id":"host-intel","name":"Host, Intel & Reputation","categories":["System / Host Utility","Threat Intelligence Platform","Reputation / File & URL Analysis"]},{"id":"malware-forensics","name":"Malware Analysis & Forensics","categories":["Dynamic Analysis / Sandbox","Static Analysis / Reverse Eng.","Digital Forensics"]},{"id":"offense-automation","name":"Offensive, Credentials & Automation","categories":["Adversary Emulation / Exploitation","Password / Credential Attack","Scripting / Automation / IaC","IDE / Code Editor"]}],"clusters":[{"id":"nids-nips-which-sensor","name":"NIDS/NIPS — which sensor?","toolsText":"Snort vs Suricata vs Zeek","decision":"Snort = original single-threaded signature IDS/IPS. Suricata = multi-threaded, runs Snort rules + protocol logging/file extraction (EVE JSON). Zeek = NOT signatures; rich metadata/behavior logs for hunting & network forensics.","toolNames":["Snort","Suricata","Zeek (formerly Bro)"]},{"id":"fast-vs-detailed-scan","name":"Fast vs detailed scan","toolsText":"Masscan vs Nmap vs Angry IP","decision":"Masscan = fastest, Internet-scale, low detail. Nmap = most detail (service/OS fingerprint, NSE). Angry IP = simple quick GUI sweep. 'Whole internet fast' → Masscan; 'depth/fingerprint' → Nmap.","toolNames":["Masscan","Nmap","Angry IP Scanner"]},{"id":"packet-capture-vs-analysis","name":"Packet capture vs analysis","toolsText":"tcpdump vs Wireshark vs tshark","decision":"tcpdump = headless CLI capture (remote box, scripting). Wireshark = GUI deep analysis. tshark = CLI Wireshark. Capture remotely with tcpdump, open the pcap in Wireshark.","toolNames":["tcpdump","Wireshark","tshark"]},{"id":"web-app-testing","name":"Web-app testing","toolsText":"Burp Suite vs OWASP ZAP vs Nikto vs Acunetix","decision":"Burp/ZAP = intercepting PROXIES for the web APP (manual + automated capabilities); ZAP is open source, while Burp has an ongoing Community Edition. Nikto = web SERVER known-vuln/misconfig scanner (noisy). Acunetix = automated commercial DAST. If the stem explicitly requires open source, ZAP beats Burp; no-cost alone does not distinguish them.","toolNames":["Burp Suite","OWASP ZAP (Zed Attack Proxy)","Nikto","Acunetix"]},{"id":"cloud-posture-vs-cloud-attack","name":"Cloud posture vs cloud attack","toolsText":"ScoutSuite vs Prowler vs Pacu","decision":"ScoutSuite = multi-cloud config audit (read-only posture). Prowler = CIS/compliance checks, AWS heritage. Pacu = OFFENSIVE AWS exploitation. Defensive audit → ScoutSuite/Prowler; attack → Pacu.","toolNames":["ScoutSuite","Prowler","Pacu"]},{"id":"static-vs-dynamic-malware","name":"Static vs dynamic malware","toolsText":"Strings/YARA/Ghidra vs Cuckoo/Joe/ANY.RUN","decision":"STATIC (no execution): Strings (text), YARA (family rules), Ghidra/IDA (disassemble). DYNAMIC (detonate): Cuckoo (open, self-host), Joe (commercial deep), ANY.RUN (interactive live).","toolNames":["Strings","YARA","Ghidra","Cuckoo Sandbox","Joe Sandbox","ANY.RUN"]},{"id":"reverse-engineering-free-vs-paid","name":"Reverse engineering: open-source vs commercial","toolsText":"Ghidra vs IDA Pro","decision":"Ghidra = open-source NSA disassembler + decompiler. IDA = commercial industry standard with a limited IDA Free edition. 'Open-source required' → Ghidra; 'industry-standard commercial workflow' → IDA. No-cost alone is not enough to distinguish them.","toolNames":["Ghidra","IDA Pro"]},{"id":"forensics-image-vs-analyze-vs-memory","name":"Forensics: image vs analyze vs memory","toolsText":"Guymager/FTK Imager vs Autopsy vs Volatility","decision":"Guymager & FTK Imager = ACQUIRE/image a disk. Autopsy = ANALYZE the disk image (GUI). Volatility = MEMORY (RAM) dump analysis. Match the verb: acquire vs analyze vs memory.","toolNames":["Guymager","FTK Imager","Autopsy","Volatility"]},{"id":"vuln-scanner-free-vs-paid","name":"Vuln scanner: architecture & availability","toolsText":"OpenVAS vs Nessus vs Nuclei","decision":"OpenVAS/Greenbone = open-source full scanner. Nessus = commercial, vendor-supported, plugin-driven standard. Nuclei = fast template-based/CI-friendly scanner. 'Open-source required' → OpenVAS; 'template-driven CI/CD' → Nuclei; 'commercial/vendor-supported dedicated scanner' → Nessus.","toolNames":["OpenVAS / Greenbone","Nessus","Nuclei"]},{"id":"adversary-emulation-scope","name":"Adversary emulation scope","toolsText":"Atomic Red Team vs Caldera vs Metasploit","decision":"Atomic Red Team = tiny per-technique ATT&CK tests (validate detections). Caldera = automated multi-step ATT&CK campaigns (agents). Metasploit = hands-on exploitation framework.","toolNames":["Atomic Red Team","MITRE Caldera","Metasploit"]},{"id":"siem-open-vs-commercial","name":"SIEM: open vs commercial","toolsText":"Wazuh vs Splunk vs Sentinel vs QRadar","decision":"Wazuh = open-source SIEM+XDR+HIDS. Splunk = SPL and mature ecosystem. Sentinel = cloud-native Microsoft/KQL with built-in automation. QRadar = enterprise offense-based correlation. Availability can break a tie only when the stem says open source/no budget/vendor support; no-cost alone may not distinguish commercial products with limited community editions.","toolNames":["Wazuh","Splunk","Microsoft Sentinel","IBM QRadar"]},{"id":"tip-sharing-vs-knowledge-graph","name":"TIP: sharing vs knowledge graph","toolsText":"MISP vs OpenCTI","decision":"MISP = IOC sharing/correlation across communities (STIX/TAXII). OpenCTI = STIX2 knowledge graph with strong ATT&CK relationships. 'Share indicators' → MISP; 'model/relate intel' → OpenCTI.","toolNames":["MISP","OpenCTI"]},{"id":"encryption-disk-vs-file","name":"Encryption: disk vs file","toolsText":"BitLocker vs EFS","decision":"BitLocker = full-VOLUME/disk encryption (TPM). EFS = individual FILE/folder encryption per user. Whole drive → BitLocker; specific files → EFS.","toolNames":["BitLocker","EFS (Encrypting File System)"]},{"id":"password-cracking-method","name":"Password cracking method","toolsText":"Ophcrack/RainbowCrack vs Hashcat vs John","decision":"Ophcrack/RainbowCrack = precomputed RAINBOW TABLES (time-memory tradeoff). Hashcat = fastest GPU brute/dictionary. John = flexible CPU, many formats.","toolNames":["Ophcrack","RainbowCrack","Hashcat","John the Ripper"]},{"id":"iac-provision-vs-configure","name":"IaC: provision vs configure","toolsText":"Terraform vs Ansible","decision":"Terraform = declaratively PROVISIONS infrastructure (HCL). Ansible = CONFIGURES existing systems (agentless YAML over SSH). Build infra → Terraform; configure it → Ansible.","toolNames":["Terraform","Ansible"]},{"id":"ip-file-email-reputation","name":"IP/file/email reputation","toolsText":"VirusTotal vs AbuseIPDB vs MXToolbox","decision":"VirusTotal = file hash/URL/IP across many AV engines + sandbox. AbuseIPDB = IP abuse reputation. MXToolbox = email headers, DNS, blacklists (SPF/DKIM/DMARC).","toolNames":["VirusTotal","AbuseIPDB","MXToolbox"]},{"id":"soar-open-vs-commercial-ecosystem","name":"SOAR: capability / ecosystem / availability","toolsText":"Cortex XSOAR vs Splunk SOAR vs TheHive vs Shuffle","decision":"Dedicated commercial orchestration → Cortex XSOAR. Already a Splunk shop → Splunk SOAR. Collaborative IR case management + analyzers/responders → TheHive+Cortex. Lightweight open-source workflow automation → Shuffle. Treat availability as a tie-breaker only when the stem makes it relevant.","toolNames":["Cortex XSOAR","Splunk SOAR","TheHive + Cortex","Shuffle"]},{"id":"osint-which-recon-tool","name":"OSINT: which recon tool?","toolsText":"theHarvester vs Maltego vs Recon-ng vs Shodan","decision":"Emails/subdomains from public sources → theHarvester. Visual relationship/link graph → Maltego. Modular framework workflow → Recon-ng. Find internet-EXPOSED devices/services → Shodan.","toolNames":["theHarvester","Maltego","Recon-ng","Shodan"]},{"id":"edr-xdr-which-vendor-cue","name":"EDR/XDR: which vendor cue?","toolsText":"Defender vs CrowdStrike Falcon vs SentinelOne","decision":"Microsoft/Windows-centric shop → Defender for Endpoint. Cloud-native, single lightweight agent → CrowdStrike Falcon. Autonomous response + one-click rollback → SentinelOne.","toolNames":["Microsoft Defender for Endpoint","CrowdStrike Falcon","SentinelOne"]},{"id":"mdm-which-platform","name":"MDM: which platform?","toolsText":"Microsoft Intune vs Jamf","decision":"Windows + Microsoft 365 or mixed fleet → Intune. Apple-only (macOS/iOS) fleet → Jamf. The device-vendor word decides it.","toolNames":["Microsoft Intune","Jamf"]},{"id":"connections-cli-vs-gui-host","name":"Connections: CLI vs GUI (host)","toolsText":"Netstat vs TCPView vs Process Explorer","decision":"Built-in CLI list of ports/connections (with PID) → Netstat. Live GUI of connections + owning process → TCPView. Deep process handles/DLLs/parent-child tree → Process Explorer.","toolNames":["Netstat","TCPView","Process Explorer"]},{"id":"scripting-language-cue","name":"Scripting language cue","toolsText":"Bash vs PowerShell vs Python","decision":"Linux shell / log parsing ($VAR, for/do/done, #!/bin/bash) → Bash. Windows admin/IR cmdlets (verb-noun, Get-Process, $var) → PowerShell. Portable custom tooling / API glue → Python.","toolNames":["Bash","PowerShell","Python"]},{"id" )."},{"cluster":"SOAR: capability / ecosystem / availability","tools":"Cortex XSOAR vs Splunk SOAR vs TheHive vs Shuffle","decision":"Dedicated commercial orchestration → Cortex XSOAR. Already a Splunk shop → Splunk SOAR. Collaborative IR case management + analyzers/responders → TheHive+Cortex. Lightweight open-source workflow automation → Shuffle. Treat availability as a tie-breaker only when the stem makes it relevant."},{"cluster":"OSINT: which recon tool?","tools":"theHarvester vs Maltego vs Recon-ng vs Shodan","decision":"Emails/subdomains from public sources → theHarvester. Visual relationship/link graph → Maltego. Modular framework workflow → Recon-ng. Find internet-EXPOSED devices/services → Shodan."},{"cluster":"EDR/XDR: which vendor cue?","tools":"Defender vs CrowdStrike Falcon vs SentinelOne","decision":"Microsoft/Windows-centric shop → Defender for Endpoint. Cloud-native, single lightweight agent → CrowdStrike Falcon. Autonomous response + one-click rollback → SentinelOne."},{"cluster":"MDM: which platform?","tools":"Microsoft Intune vs Jamf","decision":"Windows + Microsoft 365 or mixed fleet → Intune. Apple-only (macOS/iOS) fleet → Jamf. The device-vendor word decides it."},{"cluster":"Connections: CLI vs GUI (host)","tools":"Netstat vs TCPView vs Process Explorer","decision":"Built-in CLI list of ports/connections (with PID) → Netstat. Live GUI of connections + owning process → TCPView. Deep process handles/DLLs/parent-child tree → Process Explorer."},{"cluster":"Scripting language cue","tools":"Bash vs PowerShell vs Python","decision":"Linux shell / log parsing ($VAR, for/do/done, #!/bin/bash) → Bash. Windows admin/IR cmdlets (verb-noun, Get-Process, $var) → PowerShell. Portable custom tooling / API glue → Python."},{"cluster":"IaC: provision vs configure","tools":"Terraform vs Ansible","decision":"Terraform = declaratively PROVISIONS infrastructure (HCL). Ansible = CONFIGURES existing systems (agentless YAML over SSH). Build infra → Terraform; configure it → Ansible."},{"cluster":"SQL injection specifically","tools":"sqlmap vs general web scanners","decision":"'Automate / confirm / exploit SQL injection' or 'dump the database' → sqlmap, over Burp/ZAP/Acunetix. The specialized verb beats the general scanner."},{"cluster":"Free imaging vs full forensic suite","tools":"FTK Imager vs FTK / EnCase","decision":"Just ACQUIRE/preview an image → FTK Imager (ongoing no-cost proprietary utility). Deep forensic ANALYSIS suite → EnCase/full FTK. Match 'image it' vs 'analyze it in a suite' before using availability as a tie-breaker."}],"synthetic":["NetSentry Forge","PacketQuarry","VulnMosaic","ThreatWeaver","HashVoyager","ReconSpindle","CloudMole","LogHarbor","IOCsmith","MalScopeX","ForensicLattice","EndpointKite","BannerHound","PortLynx","CVECompass","TraceVault","QueryForge SIEM","RedSprout C2","CipherHarvester","ProcessFalcon","CloudPostureX","SandboxPilot","NIDSphere","ProbeWeaver","ExploitCanvas","ThreatTrellis","PacketAnvil","LogSleuth Pro","ReconOrbit","HashFoundry","BlueTeam Atlas","MalwareLoom","PortRanger X","IOC Harbor","ForensicSprout","VulnBeacon","CloudRake","ThreatLedger","PacketMint","EndpointWeaver"]};

 bindTrayTabs();$('#clusterSelect').addEventListener('change',e=>{state.cluster=e.target.value;renderConfusion()});$('#gradeBtn').addEventListener('click',()=>{gradeSlots(items.length,c.decision);$('#clusterDecision').style.display='block'});$('#quizReset').addEventListener('click',renderConfusion);$('#shuffleBtn').addEventListener('click',()=>{$$('.bank').forEach(b=>shuffle($$('.chip',b)).forEach(x=>b.appendChild(x)))})
}
function makeNameRound(){const real=shuffle(uniqueTools()).slice(0,10).map(t=>({name:t.tool,real:true}));const fake=shuffle(DATA.synthetic).slice(0,10).map(name=>({name,real:false}));return shuffle([...real,...fake])}
let nameRound=makeNameRound();
function renderNames(){const pools=splitPools(nameRound,3);const tabs=pools.map((p,i)=>({id:`n${i}`,label:`Pool ${i+1}`,bank:`name-bank-${i}`,bankLabel:`Names — ${p.length} items`}));const host=$('#quizHost');
 host.innerHTML=`<div class="instructions"><b>Name-recognition drill.</b> “Legitimate” means the name appears in your uploaded study spreadsheet. Synthetic distractors are invented for this trainer; this mode is not making a global claim that a coincidentally similar product name could never exist.</div><div class="quiz-workspace"><div class="quiz-stage"><div class="name-buckets"><div class="bucket" data-key="real"><h3>Study-Sheet Tool / Service</h3><div class="hint">A legitimate name from your 100-tool study list.</div></div><div class="bucket" data-key="fake"><h3>Synthetic Distractor</h3><div class="hint">Invented for this trainer.</div></div></div></div>${trayHtml('Name Tray','Names only — no category or function hints.',tabs)}</div>`;
 $$('.name-buckets .bucket').forEach(b=>bindDrop(b,true));pools.forEach((p,i)=>p.forEach((x,j)=>$(`#name-bank-${i}`).appendChild(makeChip({id:`name-${i}-${j}-${slug(x.name)}`,text:x.name,home:`name-bank-${i}`,kind:'name',bucket:x.real?'real':'fake'}))));
 bindTrayTabs();$('#gradeBtn').addEventListener('click',()=>gradeBuckets(nameRound.length));$('#quizReset').addEventListener('click',()=>{nameRound=makeNameRound();renderNames()});$('#shuffleBtn').addEventListener('click',()=>{$$('.bank').forEach(b=>shuffle($$('.chip',b)).forEach(c=>b.appendChild(c)))})
}
function renderCheats(){const host=$('#cheatHost');const cats=[...new Set(DATA.tools.map(t=>t.category))];host.innerHTML=`<details open><summary>How this trainer uses availability</summary><div class="callout"><b>Function stays primary.</b> Availability is a subordinate characteristic used only to sharpen recognition when a stem makes it relevant. The compact buckets are: <b>Native / Included</b>, <b>Open Source</b>, <b>Free Proprietary / No-Cost Resource</b>, <b>Commercial + Free / Community Edition</b>, and <b>Commercial / Paid</b>. Temporary trials are ignored.</div><p><b>${uniqueTools().length} unique tool names</b> appear across <b>${DATA.tools.length} category entries</b>. Two tools are intentionally cross-listed: <b>Strings</b> and <b>hping3</b>. <b>WHOIS</b> remains in the trainer but is excluded only from availability sorting because it is a protocol/resource concept rather than one specific licensable product.</p></details><details><summary>Exam-selection strategy from your cues</summary><ul><li>Start with the <b>verb/function</b>: capture, analyze, image, exploit, provision, configure, share, correlate, scan, or recover.</li><li>Then use the <b>technical discriminator</b>: GUI vs CLI, active vs passive, cloud vs on-prem, broad scanner vs specialized tool, vendor ecosystem, or similar scope clues.</li><li>Use <b>availability</b> only when the stem actually says open source, native/no-install, no purchase budget, vendor-supported/commercial, or otherwise makes availability relevant.</li><li>If two answers can both perform the broad task, prefer the one whose specialty matches the stem more precisely.</li></ul></details><div id="categoryCheats"></div><details><summary>High-confusion “Which tool?” sheet</summary><table class="ref-table"><tr><th>Cluster</th><th>Tools</th><th>How to decide</th></tr>${DATA.cheatRows.map(r=>`<tr class="searchable"><td>${r.cluster}</td><td>${r.tools}</td><td>${r.decision}</td></tr>`).join('')}</table></details><details><summary>Cross-listed tools</summary><div class="callout warn"><b>Strings</b> appears under both System / Host Utility and Static Analysis / Reverse Engineering. <b>hping3</b> appears under both Network Scanner and Adversary Emulation / Exploitation. That is useful exam practice: the same tool can be categorized differently depending on the task being emphasized.</div></details>`;
 const ch=$('#categoryCheats');cats.forEach(cat=>{const d=document.createElement('details');d.className='searchable';d.innerHTML=`<summary>${cat}</summary><div class="tool-list"></div>`;ch.appendChild(d);toolsForCategory(cat).forEach(t=>{const el=document.createElement('div');el.className='tool-cheat searchable';el.dataset.search=`${t.tool} ${t.category} ${t.cue} ${t.features} ${t.availability_label||''} ${t.persistent_free_edition||''} ${t.availability_note||''}`.toLowerCase();const availability=t.availability_sort===false?'Not classified for availability sorting':availabilityLabel(t.availability_type);const free=t.persistent_free_edition?`<div class="meta"><b>Persistent free/community:</b> ${t.persistent_free_edition}</div>`:'';el.innerHTML=`<div class="tn">${t.tool}</div><div class="meta"><b>Function:</b> ${t.category}</div><div class="cue"><b>Exam cue:</b> ${t.cue}</div><div class="meta"><b>Interface / platform:</b> ${t.interface} · ${t.platform}</div><div class="meta"><b>Availability:</b> ${availability}</div>${free}${t.availability_note?`<div class="meta">${t.availability_note}</div>`:''}`;$('.tool-list',d).appendChild(el)})});
 $('#cheatSearch').addEventListener('input',filterCheats)
}
function filterCheats(){const q=$('#cheatSearch').value.trim().toLowerCase();$$('.tool-cheat').forEach(el=>el.classList.toggle('hidden-by-search',q&&!el.dataset.search.includes(q)));if(q){$$('#categoryCheats details').forEach(d=>{const visible=$$('.tool-cheat:not(.hidden-by-search)',d).length;d.classList.toggle('hidden-by-search',visible===0);if(visible)d.open=true})}else{$$('#categoryCheats details').forEach(d=>d.classList.remove('hidden-by-search'))}}
function renderQuiz(){cleanupSelection();clearScore();const q=QUIZZES.find(x=>x.id===state.quiz);$('#quizDesc').textContent=q.desc;switch(state.quiz){case'sorter':renderSorter();break;case'function':renderFunction();break;case'scenario':state.scenarioQuestions=[];makeScenarioRound();renderScenario();break;case'confusion':renderConfusion();break;case'names':nameRound=makeNameRound();renderNames();break}}
$('#darkBtn').addEventListener('click',()=>{document.body.classList.toggle('dark');$('#darkBtn').textContent=document.body.classList.contains('dark')?'☀️ Light':'🌙 Dark';try{localStorage.setItem('tools-trainer-dark',document.body.classList.contains('dark')?'1':'0')}catch(e){}});
$('#cheatBtn').addEventListener('click',()=>{const m=$('#main');m.classList.toggle('sidebar-hidden');$('#cheatBtn').textContent=m.classList.contains('sidebar-hidden')?'Show Cheats':'Hide Cheats'});
$('#resetBtn').addEventListener('click',renderQuiz);
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='Enter')$('#gradeBtn')?.click();if(e.key==='r'||e.key==='R')renderQuiz();if(e.key==='c'||e.key==='C')$('#cheatBtn').click()});
try{if(localStorage.getItem('tools-trainer-dark')==='1'){document.body.classList.add('dark');$('#darkBtn').textContent='☀️ Light'}}catch(e){}
initPicker();renderCheats();renderQuiz();
</script>
</body>
</html>
